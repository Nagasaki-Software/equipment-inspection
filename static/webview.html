<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webページ表示</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        #web-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* 右下ボタンエリア（サイネージボタンのみ） */
        #btn-area {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        /* ボタン共通スタイル */
        .nav-btn {
            display: block;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
            min-width: 130px;
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        /* サイネージに戻るボタン */
        #btn-signage {
            background: rgba(0, 100, 200, 0.72);
            color: #fff;
            text-decoration: none;
        }

        #btn-signage:hover {
            background: rgba(0, 120, 230, 0.88);
        }

        /* ページラベル（右上） */
        #page-label {
            position: fixed;
            top: 18px;
            right: 18px;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <!-- ページラベル（右上） -->
    <div id="page-label"></div>

    <!-- iframe 本体 -->
    <iframe id="web-iframe" src="about:blank"></iframe>

    <!-- 右下ボタンエリア -->
    <div id="btn-area">
        <!-- サイネージに戻るボタン -->
        <a href="/" id="btn-signage" class="nav-btn">🏠 サイネージ</a>
    </div>

    <script src="/inactivity.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            const label = params.get('label');
            const iframe = document.getElementById('web-iframe');

            // ページラベルの設定
            if (label) {
                document.getElementById('page-label').textContent = label;
            }

            // iframeにURLをセット
            if (url) {
                iframe.src = url;
            } else {
                alert('URLが指定されていません');
                window.location.href = '/';
            }
        })();
    </script>
</body>
</html>
