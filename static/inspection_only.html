<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設備点検システム</title>
    <meta name="description" content="設備の使用前点検・月例点検を管理するシステム" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <div id="app-wrapper">

        <!-- ヘッダー -->
        <header id="app-header">
            <h1>設備点検システム</h1>
            <div class="header-right">
                <button class="btn btn-secondary" id="btn-settings">⚙ 設定</button>
            </div>
        </header>

        <!-- メインエリア（サイドバー + コンテンツ）。下まで伸びる -->
        <div id="main-area">

            <!-- 左サイドバー（ページ下端まで伸ばす） -->
            <aside id="sidebar">

                <!-- リアルタイム時計 -->
                <div class="sidebar-section">
                    <div id="clock-display">----/--/-- --:--:--</div>
                </div>

                <!-- 建物情報 -->
                <div class="sidebar-section">
                    <h3>建物情報</h3>
                    <div class="info-row">
                        <div class="info-label">建物名</div>
                        <div class="info-value" id="sb-building-name">-</div>
                    </div>
                </div>

                <!-- 管理者（最大3名） -->
                <div class="sidebar-section">
                    <h3>管理者</h3>
                    <div id="sb-managers-list"></div>
                </div>

                <!-- 対象期間 -->
                <div class="sidebar-section">
                    <h3>点検月</h3>
                    <div class="info-row">
                        <div class="info-value" id="sb-period">-</div>
                    </div>
                </div>
            </aside>

            <!-- 右コンテンツエリア -->
            <div id="content-area">

                <!-- 使用前 / 月例 切り替えタブ -->
                <nav id="mode-tabs">
                    <div class="mode-tab active" data-mode="使用前">使用前点検</div>
                    <div class="mode-tab" data-mode="月例">月例点検</div>
                </nav>

                <!-- 大分類タブ -->
                <div id="major-tabs"></div>

                <!-- 小分類タブ -->
                <div id="minor-tabs"></div>

                <!-- コントロールバー -->
                <div id="control-bar"
                    style="display:flex; justify-content:flex-start; align-items:center; flex-wrap:wrap; gap:10px;">
                    <span class="control-label" id="date-label">点検日：</span>
                    <input type="date" id="inspection-date" />
                    <span class="control-label">年月：</span>
                    <input type="month" id="target-month" />
                </div>

                <!-- 点検表エリア（入力テーブル） -->
                <div id="inspection-panel">

                    <!-- 点検完了オーバーレイ -->
                    <div id="completed-banner" style="display:none">
                        <div class="completed-msg">✅ 本日の点検は終了しました</div>
                    </div>

                    <div class="inspection-table-wrap">
                        <table class="inspection-table" id="inspection-table">
                            <thead>
                                <tr>
                                    <th style="min-width:300px">点検項目</th>
                                    <th style="width:100px;text-align:center">結果</th>
                                </tr>
                            </thead>
                            <tbody id="inspection-tbody">
                                <tr>
                                    <td colspan="3" style="text-align:center;padding:20px;color:#aaa">点検種別・分類を選択してください
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 月間点検表（使用前点検用・常時表示） -->
                    <div id="daily-summary-section" style="display:none">
                        <h3 id="daily-summary-title" style="font-size:14px; margin:16px 0 8px; color:#1a3a5c;">点検表</h3>
                        <div id="daily-summary-wrap" style="overflow-x:auto;">
                            <table id="daily-summary-table"
                                style="border-collapse:collapse; width:100%; font-size:12px;">
                                <thead id="daily-summary-thead"></thead>
                                <tbody id="daily-summary-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- アクションバー -->
                <div id="action-bar">
                    <button class="btn btn-primary" id="btn-pdf">📄 PDF出力</button>
                    <span class="save-status" id="save-status"></span>
                </div>

            </div><!-- /content-area -->
        </div><!-- /main-area -->
    </div><!-- /app-wrapper -->

    <!-- 設定モーダル -->
    <div id="settings-overlay">
        <div id="settings-modal">
            <h2>⚙ システム設定</h2>

            <div style="margin-bottom:18px">
                <h3 style="font-size:13px;color:#1a3a5c;margin-bottom:8px">保存先フォルダ</h3>
                <div class="form-row">
                    <label>ファイルサーバ保存先パス（空白=アプリフォルダ内）</label>
                    <input type="text" id="cfg-save-dir" placeholder="例: \\server\share\inspection" />
                </div>
            </div>

            <div style="margin-bottom:18px">
                <h3 style="font-size:13px;color:#1a3a5c;margin-bottom:8px">建物情報</h3>
                <div class="form-row">
                    <label>建物名</label>
                    <input type="text" id="cfg-building-name" />
                </div>
            </div>

            <div style="margin-bottom:18px">
                <h3 style="font-size:13px;color:#1a3a5c;margin-bottom:8px">管理者（最大3名）</h3>
                <!-- 管理者1 -->
                <div class="manager-block">
                    <div class="manager-block-title">管理者 1</div>
                    <div class="form-row-inline">
                        <div class="form-row half"><label>役職名</label><input type="text" id="cfg-mgr-0-title"
                                placeholder="例：施設長" /></div>
                        <div class="form-row half"><label>氏名</label><input type="text" id="cfg-mgr-0-name" /></div>
                    </div>
                    <div class="form-row-inline">
                        <div class="form-row half"><label>内線</label><input type="text" id="cfg-mgr-0-phone_int" /></div>
                        <div class="form-row half"><label>外線</label><input type="text" id="cfg-mgr-0-phone_ext" /></div>
                    </div>
                </div>
                <!-- 管理者2 -->
                <div class="manager-block">
                    <div class="manager-block-title">管理者 2</div>
                    <div class="form-row-inline">
                        <div class="form-row half"><label>役職名</label><input type="text" id="cfg-mgr-1-title"
                                placeholder="例：副施設長" /></div>
                        <div class="form-row half"><label>氏名</label><input type="text" id="cfg-mgr-1-name" /></div>
                    </div>
                    <div class="form-row-inline">
                        <div class="form-row half"><label>内線</label><input type="text" id="cfg-mgr-1-phone_int" /></div>
                        <div class="form-row half"><label>外線</label><input type="text" id="cfg-mgr-1-phone_ext" /></div>
                    </div>
                </div>
                <!-- 管理者3 -->
                <div class="manager-block">
                    <div class="manager-block-title">管理者 3</div>
                    <div class="form-row-inline">
                        <div class="form-row half"><label>役職名</label><input type="text" id="cfg-mgr-2-title"
                                placeholder="例：担当者" /></div>
                        <div class="form-row half"><label>氏名</label><input type="text" id="cfg-mgr-2-name" /></div>
                    </div>
                    <div class="form-row-inline">
                        <div class="form-row half"><label>内線</label><input type="text" id="cfg-mgr-2-phone_int" /></div>
                        <div class="form-row half"><label>外線</label><input type="text" id="cfg-mgr-2-phone_ext" /></div>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-settings-cancel">キャンセル</button>
                <button class="btn btn-primary" id="btn-settings-save">保存</button>
            </div>
        </div>
    </div>

    <!-- サイネージ機能を無効化 -->
    <script>window.INSPECTION_ONLY = true;</script>
    <script src="/app.js"></script>
</body>

</html>
