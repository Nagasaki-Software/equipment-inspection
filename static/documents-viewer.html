<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <title>PDFビューア</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
        #viewer-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #viewer-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        #pdf-canvas {
            display: block;
            cursor: grab;
            touch-action: none;
        }
        #pdf-canvas:active {
            cursor: grabbing;
        }
        #page-counter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
        }
        #viewer-error {
            display: none;
            color: white;
            font-size: 18px;
            text-align: center;
            padding: 40px;
        }
        .viewer-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.8);
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s;
        }
        .viewer-nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        #viewer-btn-prev { left: 16px; }
        #viewer-btn-next { right: 16px; }
    </style>
</head>
<body>
    <div id="viewer-wrapper">
        <header id="app-header">
            <h1 id="viewer-title">PDF</h1>
            <div class="header-right">
                <a id="btn-back" href="/documents/list" class="btn btn-secondary">← 戻る</a>
                <a href="/" class="btn btn-secondary">← サイネージ</a>
            </div>
        </header>
        <div id="viewer-main">
            <button id="viewer-btn-prev" class="viewer-nav-btn">&#10094;</button>
            <canvas id="pdf-canvas"></canvas>
            <div id="page-counter"></div>
            <div id="viewer-error">PDFを読み込めませんでした</div>
            <button id="viewer-btn-next" class="viewer-nav-btn">&#10095;</button>
        </div>
    </div>
    <script src="/inactivity.js"></script>
    <script type="module" src="/documents-viewer.js"></script>
</body>
</html>
